<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card Base -->
  <rect x="15" y="20" width="85" height="120" rx="14" fill="#3B82F6" opacity="0.4" transform="rotate(-14 57 80)" />
  <rect x="40" y="16" width="92" height="128" rx="16" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Decorative Corner 7s -->
  <text x="50" y="42" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="18" font-weight="900" fill="#FBBF24">7</text>
  <text x="122" y="132" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="18" font-weight="900" fill="#FBBF24" text-anchor="end">7</text>
  <!-- Center Golden Bold 7 -->
  <text x="86" y="96" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">7</text>
  <!-- Flip Sparkles -->
  <polygon points="112,38 116,48 126,52 116,56 112,66 108,56 98,52 108,48" fill="#FCD34D" />
</svg>
